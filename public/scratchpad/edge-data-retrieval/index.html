<div id="app"></div>

<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap');

#app {
  /* cool slate-blue neutral scale */
  --n-0: oklch(99% 0.003 250);
  --n-50: oklch(96.5% 0.004 250);
  --n-100: oklch(93% 0.006 250);
  --n-200: oklch(88% 0.008 250);
  --n-300: oklch(78% 0.010 250);
  --n-400: oklch(64% 0.012 250);
  --n-500: oklch(52% 0.014 250);
  --n-600: oklch(40% 0.016 250);
  --n-700: oklch(30% 0.018 250);
  --n-800: oklch(22% 0.02 250);
  --n-900: oklch(16% 0.02 250);

  --accent-slate: oklch(38% 0.05 250);
  --accent-slate-strong: oklch(30% 0.055 250);
  --accent-slate-soft: oklch(93% 0.012 250);
  --accent-slate2: oklch(60% 0.035 250);
  --accent-slate2-strong: oklch(48% 0.04 250);
  --accent-slate2-soft: oklch(94% 0.01 250);

  --success: oklch(52% 0.11 145);
  --success-soft: oklch(95% 0.03 145);
  --warning: oklch(68% 0.13 80);
  --warning-strong: oklch(48% 0.11 80);
  --warning-soft: oklch(95% 0.04 80);
  --danger: oklch(54% 0.16 25);
  --danger-soft: oklch(95% 0.03 25);

  --bg: var(--n-50);
  --bg-raised: var(--n-0);
  --surface-card: var(--n-0);
  --ink: var(--n-800);
  --ink-soft: var(--n-500);
  --ink-faint: var(--n-300);
  --ink-inverse: var(--n-50);
  --border: var(--n-200);
  --border-strong: var(--n-300);
  --brand: var(--accent-slate);
  --brand-strong: var(--accent-slate-strong);
  --brand-soft: var(--accent-slate-soft);

  --font-display: 'Sora', -apple-system, sans-serif;
  --font-body: 'Source Serif 4', Georgia, serif;
  --font-mono: 'IBM Plex Mono', 'SF Mono', monospace;

  --text-xs: 13px; --text-sm: 15px; --text-base: 17px; --text-lg: 20px;
  --text-xl: 26px; --text-2xl: 34px; --text-3xl: 46px; --text-4xl: 64px;
  --leading-tight: 1.1; --leading-snug: 1.3; --leading-normal: 1.55;
  --weight-regular: 400; --weight-medium: 500; --weight-semibold: 600; --weight-bold: 700;
  --tracking-tight: -0.01em; --tracking-wide: 0.05em;

  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 24px;
  --space-6: 32px; --space-7: 48px; --space-8: 64px; --space-9: 96px;
  --content-max: 760px; --page-max: 1200px;

  --radius-sm: 2px; --radius-md: 4px; --radius-lg: 6px; --radius-pill: 999px;
  --border-width: 1px;
  --ease-standard: cubic-bezier(0.2, 0.6, 0.2, 1);
  --duration-fast: 120ms; --duration-normal: 200ms;

  font-family: var(--font-body);
  color: var(--ink);
  background: var(--bg);
  line-height: var(--leading-normal);
  -webkit-font-smoothing: antialiased;
}
#app * { box-sizing: border-box; }
.wrap { max-width: var(--page-max); margin: 0 auto; padding: var(--space-7) var(--space-6) var(--space-9); }

/* ── Masthead ── */
.masthead { border-bottom: 1px solid var(--border); padding-bottom: var(--space-6); }
.eyebrow { display: flex; align-items: center; gap: 10px; margin-bottom: var(--space-4); }
.eyebrow-rule { width: 16px; height: 1px; background: var(--ink-faint); flex: none; }
.eyebrow-txt { font-family: var(--font-mono); font-size: 12px; letter-spacing: var(--tracking-wide); color: var(--ink-soft); }
.masthead h1 {
  font-family: var(--font-display); font-size: var(--text-3xl); font-weight: var(--weight-bold);
  line-height: var(--leading-tight); letter-spacing: var(--tracking-tight);
  margin: 0 0 var(--space-4); max-width: 20ch; color: var(--ink);
}
.standfirst {
  font-family: var(--font-body); font-size: var(--text-lg); line-height: var(--leading-normal);
  color: var(--ink); margin: 0; max-width: 620px;
}
.byline { font-family: var(--font-body); font-style: italic; color: var(--ink-soft); font-size: var(--text-sm); margin-top: var(--space-3); }

/* ── Nav ── */
.nav { display: flex; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.nav button {
  font-family: var(--font-display); font-size: var(--text-sm); font-weight: var(--weight-medium);
  letter-spacing: var(--tracking-tight); background: transparent; border: none;
  border-bottom: 2px solid transparent; color: var(--ink-soft);
  padding: var(--space-4) var(--space-5) var(--space-3); cursor: pointer; margin-bottom: -1px;
  transition: color var(--duration-fast) var(--ease-standard);
}
.nav button:hover { color: var(--ink); }
.nav button:focus-visible { outline: 1px solid var(--brand); outline-offset: -2px; }
.nav button[aria-selected="true"] { color: var(--brand); border-bottom-color: var(--brand); }

.pane { padding-top: var(--space-2); }
.sec-label { display: flex; align-items: center; gap: 10px; margin: var(--space-7) 0 var(--space-5); }
.sec-label .r { width: 16px; height: 1px; background: var(--ink-faint); flex: none; }
.sec-label .x { font-family: var(--font-mono); font-size: 12px; letter-spacing: var(--tracking-wide); color: var(--ink-soft); }

.lede { font-family: var(--font-body); font-size: var(--text-base); line-height: var(--leading-normal); color: var(--ink); max-width: 660px; margin: 0 0 var(--space-5); }
.body-text { font-family: var(--font-body); font-size: var(--text-sm); line-height: var(--leading-normal); color: var(--ink-soft); max-width: 680px; }
.body-text p { margin: 0 0 var(--space-3); }
.body-text p:last-child { margin-bottom: 0; }
.body-text em { font-style: italic; }

svg .t { font-family: var(--font-body); font-size: 14px; fill: var(--ink-soft); }
svg .tm { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.05em; fill: var(--ink-soft); }
svg .th { font-family: var(--font-display); font-size: 14px; font-weight: 600; fill: var(--ink); }

/* ── Cards ── */
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: var(--space-4); }
.strat {
  background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius-md);
  padding: var(--space-5); cursor: pointer; text-align: left; width: 100%;
  transition: border-color var(--duration-fast) var(--ease-standard);
}
.strat:hover { border-color: var(--border-strong); }
.strat:focus-visible { outline: 1px solid var(--brand); outline-offset: 2px; }
.strat[aria-pressed="true"] { border-color: var(--brand); box-shadow: inset 2px 0 0 var(--brand); }
.strat-n { font-family: var(--font-mono); font-size: 12px; letter-spacing: var(--tracking-wide); color: var(--ink-soft); display: block; margin-bottom: var(--space-2); }
.strat-t { font-family: var(--font-display); font-weight: var(--weight-semibold); font-size: var(--text-lg); line-height: var(--leading-snug); letter-spacing: var(--tracking-tight); display: block; margin-bottom: 6px; color: var(--ink); }
.strat-s { font-family: var(--font-body); font-size: var(--text-sm); color: var(--ink-soft); line-height: var(--leading-normal); display: block; margin-bottom: var(--space-4); }

.badge {
  font-family: var(--font-mono); font-size: 12px; font-weight: var(--weight-medium);
  letter-spacing: var(--tracking-wide); padding: 3px 9px; border-radius: var(--radius-sm);
  white-space: nowrap; display: inline-block;
}
.badge.b-go { background: var(--success-soft); color: var(--success); }
.badge.b-stop { background: var(--danger-soft); color: var(--danger); }
.badge.b-hold { background: var(--warning-soft); color: var(--warning-strong); }
.badge.b-dead { background: var(--n-100); color: var(--ink-soft); }

.detail-panel { margin-top: var(--space-6); border-top: 1px solid var(--border-strong); padding-top: var(--space-5); }
.dp-h { font-family: var(--font-display); font-size: var(--text-xl); font-weight: var(--weight-bold); letter-spacing: var(--tracking-tight); line-height: var(--leading-snug); margin: 0 0 6px; }
.dp-sub { font-family: var(--font-mono); font-size: 12px; letter-spacing: var(--tracking-wide); color: var(--ink-soft); margin-bottom: var(--space-5); }
.dp-body { font-family: var(--font-body); font-size: var(--text-base); line-height: var(--leading-normal); color: var(--ink); max-width: 680px; margin-bottom: var(--space-6); }

.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: var(--space-6); margin-bottom: var(--space-6); }
.col-h { font-family: var(--font-display); font-size: var(--text-xs); font-weight: var(--weight-semibold); letter-spacing: var(--tracking-wide); color: var(--ink-soft); border-bottom: 1px solid var(--border-strong); padding-bottom: 10px; margin-bottom: var(--space-4); }
.pt { display: grid; grid-template-columns: 14px 1fr; gap: 10px; font-family: var(--font-body); font-size: var(--text-sm); color: var(--ink-soft); line-height: var(--leading-normal); margin-bottom: var(--space-3); }
.pt-m { font-family: var(--font-mono); font-size: 13px; padding-top: 1px; }
.pt-m.plus { color: var(--success); }
.pt-m.minus { color: var(--danger); }

.verdict { padding: var(--space-5); border-radius: var(--radius-md); background: var(--n-100); border-left: 2px solid var(--accent-slate); }
.verdict.is-go { border-left-color: var(--success); }
.verdict.is-stop { border-left-color: var(--danger); }
.verdict.is-hold { border-left-color: var(--warning); }
.verdict-h { font-family: var(--font-mono); font-size: 12px; letter-spacing: var(--tracking-wide); color: var(--ink-soft); margin-bottom: var(--space-2); }
.verdict-b { font-family: var(--font-body); font-size: var(--text-sm); line-height: var(--leading-normal); color: var(--ink); }

.scenarios { display: grid; grid-template-columns: repeat(auto-fit, minmax(186px, 1fr)); gap: var(--space-3); }
.scn {
  background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius-md);
  padding: var(--space-4); cursor: pointer; text-align: left;
  transition: border-color var(--duration-fast) var(--ease-standard);
}
.scn:hover { border-color: var(--border-strong); }
.scn:focus-visible { outline: 1px solid var(--brand); outline-offset: 2px; }
.scn[aria-pressed="true"] { border-color: var(--brand); box-shadow: inset 2px 0 0 var(--brand); }
.scn-n { font-family: var(--font-mono); font-size: 12px; color: var(--ink-soft); letter-spacing: var(--tracking-wide); display: block; margin-bottom: 6px; }
.scn-t { font-family: var(--font-display); font-weight: var(--weight-semibold); font-size: var(--text-base); display: block; margin-bottom: 4px; color: var(--ink); }
.scn-s { font-family: var(--font-body); font-size: var(--text-sm); color: var(--ink-soft); line-height: var(--leading-normal); }

/* ── Chain ── */
.chain { margin-top: var(--space-5); }
.hop { display: grid; grid-template-columns: 24px 1fr; gap: var(--space-4); }
.rail { display: flex; flex-direction: column; align-items: center; }
.dot { width: 9px; height: 9px; border-radius: var(--radius-pill); margin-top: 22px; border: 1px solid var(--ink-faint); background: var(--bg); flex: none; }
.hop.s-go .dot { background: var(--success); border-color: var(--success); }
.hop.s-stop .dot { background: var(--danger); border-color: var(--danger); }
.hop.s-hold .dot { background: var(--warning); border-color: var(--warning); }
.hop.s-dead .dot { background: var(--bg); border-color: var(--border-strong); }
.stem { width: 1px; flex: 1; background: var(--border-strong); margin-top: 5px; }
.hop.s-go .stem { background: var(--success); opacity: .4; }
.hop:last-child .stem { display: none; }

.card {
  background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius-md);
  padding: var(--space-4) var(--space-5); margin-bottom: var(--space-3); cursor: pointer;
  transition: border-color var(--duration-fast) var(--ease-standard);
}
.card:hover { border-color: var(--border-strong); }
.card:focus-visible { outline: 1px solid var(--brand); outline-offset: 2px; }
.hop.s-dead .card { opacity: .55; }
.card-top { display: flex; align-items: baseline; gap: var(--space-3); flex-wrap: wrap; }
.hop-n { font-family: var(--font-mono); font-size: 12px; color: var(--ink-soft); letter-spacing: var(--tracking-wide); }
.hop-t { font-family: var(--font-display); font-weight: var(--weight-semibold); font-size: var(--text-base); flex: 1; min-width: 180px; color: var(--ink); }
.card-s { font-family: var(--font-body); font-size: var(--text-sm); color: var(--ink-soft); margin-top: 6px; line-height: var(--leading-normal); }
.expand-hint { font-family: var(--font-mono); font-size: 11px; color: var(--ink-faint); margin-top: 10px; letter-spacing: var(--tracking-wide); }
.detail { margin-top: var(--space-4); padding-top: var(--space-4); border-top: 1px solid var(--border); display: none; }
.card.open .detail { display: block; }
.drow { display: grid; grid-template-columns: 96px 1fr; gap: var(--space-2) var(--space-4); font-family: var(--font-body); font-size: var(--text-sm); margin-bottom: var(--space-3); align-items: start; }
.dk { font-family: var(--font-display); font-size: var(--text-xs); font-weight: var(--weight-semibold); letter-spacing: var(--tracking-wide); color: var(--ink-soft); padding-top: 2px; }
.dv { color: var(--ink-soft); line-height: var(--leading-normal); }

.consid { border-top: 1px solid var(--border); padding: var(--space-5) 0; }
.consid-top { display: flex; align-items: baseline; gap: var(--space-3); flex-wrap: wrap; margin-bottom: 10px; }
.consid-h { font-family: var(--font-display); font-weight: var(--weight-semibold); font-size: var(--text-base); flex: 1; min-width: 200px; color: var(--ink); }

/* ── Glossary ── */
.gl { border-bottom: 1px dotted var(--accent-slate2); cursor: help; position: relative; color: var(--ink); }
.gl:focus-visible { outline: 1px solid var(--brand); outline-offset: 2px; }
.gl .tip {
  visibility: hidden; opacity: 0; position: absolute; bottom: calc(100% + 10px); left: 0;
  width: 300px; background: var(--n-800); color: var(--n-50); padding: var(--space-4);
  border-radius: var(--radius-md); font-family: var(--font-body); font-size: var(--text-xs);
  line-height: var(--leading-normal); z-index: 60; pointer-events: none;
  transition: opacity var(--duration-fast) var(--ease-standard);
  box-shadow: 0 4px 16px oklch(20% 0.01 250 / 0.18);
  letter-spacing: normal; font-weight: var(--weight-regular);
}
.gl:hover .tip, .gl:focus .tip, .gl:focus-within .tip { visibility: visible; opacity: 1; }
.tip b {
  display: block; margin-bottom: 6px; font-family: var(--font-mono); font-size: 11px;
  font-weight: var(--weight-medium); letter-spacing: var(--tracking-wide); color: var(--n-0);
}
.tip cite { display: block; margin-top: var(--space-2); font-style: italic; font-size: 12px; color: var(--n-400); }

/* ── Sources table ── */
.reftable { width: 100%; border-collapse: collapse; font-family: var(--font-body); font-size: var(--text-sm); }
.reftable th {
  text-align: left; padding: 10px 12px; font-family: var(--font-display); font-size: var(--text-xs);
  font-weight: var(--weight-semibold); letter-spacing: var(--tracking-wide); color: var(--ink-soft);
  border-bottom: 1px solid var(--border-strong);
}
.reftable td { padding: var(--space-3); border-bottom: 1px solid var(--border); color: var(--ink-soft); vertical-align: top; line-height: var(--leading-normal); }
.reftable td.num { font-family: var(--font-mono); font-size: 12px; color: var(--ink-faint); width: 40px; }
.reftable a { color: var(--brand); text-decoration: none; border-bottom: 1px solid var(--accent-slate-soft); }
.reftable a:hover { border-bottom-color: var(--brand); }
.reftable em { font-style: italic; }

.pullquote {
  margin-top: var(--space-6); background: var(--n-100); border-left: 2px solid var(--accent-slate);
  padding: var(--space-5); font-family: var(--font-body); font-style: italic;
  color: var(--ink-soft); font-size: var(--text-sm); line-height: var(--leading-normal);
}

.stats { display: flex; gap: var(--space-7); flex-wrap: wrap; margin-bottom: var(--space-5); }
.stat-n { font-family: var(--font-display); font-weight: var(--weight-bold); font-size: var(--text-2xl); color: var(--accent-slate); letter-spacing: var(--tracking-tight); line-height: 1.1; }
.stat-l { font-family: var(--font-body); font-size: var(--text-sm); color: var(--ink-soft); }

@media (max-width: 680px) {
  .wrap { padding: var(--space-5) var(--space-4) var(--space-8); }
  .masthead h1 { font-size: var(--text-xl); }
  .standfirst { font-size: var(--text-base); }
  .drow { grid-template-columns: 1fr; gap: 2px 0; margin-bottom: var(--space-4); }
  .gl .tip { width: 240px; }
  .nav button { padding: var(--space-3); font-size: var(--text-xs); }
  .hop { grid-template-columns: 18px 1fr; gap: var(--space-3); }
}
@media (prefers-reduced-motion: reduce) { #app *, #app *::before { transition: none !important; } }
</style>

<script>
(function () {
  const G = {
    ihi: ['Individual Healthcare Identifier', 'A 16-digit number identifying a healthcare recipient under the Healthcare Identifiers Act 2010. Issued automatically to everyone enrolled in Medicare or with DVA. Distinct from a Medicare number — a person may hold several Medicare numbers over a lifetime but only one IHI.', 'Dept of Health / OAIC'],
    hiservice: ['HI Service', 'The Healthcare Identifiers Service, operated by Services Australia. Holds the register of IHIs, HPI-Is and HPI-Os, and logs every access to an identifier.', 'Services Australia'],
    hpio: ['HPI-O', 'Healthcare Provider Identifier – Organisation. Identifies a provider organisation. An organisation must hold one to use the HI Service; registering a seed organisation also registers it for My Health Record.', 'Services Australia'],
    hpii: ['HPI-I', 'Healthcare Provider Identifier – Individual. Assigned automatically to all Ahpra-registered practitioners, including registered paramedics, and linked to the organisation\'s HPI-O to access records on its behalf.', 'Services Australia'],
    s64: ['Section 64, My Health Records Act 2012', 'The break-glass provision. Permits collection, use or disclosure of My Health Record information where a provider reasonably believes it necessary to lessen or prevent a serious threat to life, health or safety and consent cannot reasonably be obtained — or to prevent a serious threat to public health or safety.', 'My Health Records Act 2012 (Cth)'],
    hiact: ['Healthcare Identifiers Act 2010', 'Establishes the HI Service and limits the purposes for which an IHI may be collected, used, disclosed or adopted. Unauthorised use by a staff member may be an offence, and the organisation may still be liable for the privacy breach.', 'OAIC'],
    serious: ['Serious threat', 'A threat posing significant danger to a person\'s physical or mental health or safety, or to another\'s safety. Both the HI Act and s.64 permit use or disclosure to lessen or prevent one.', 'OAIC guidance'],
    aups: ['AU Patient Summary', 'The Australian localisation of the International Patient Summary, developed through the Sparked FHIR Accelerator. Reached R1 Working Standard in 2026. A FHIR Bundle carrying allergies, medicines, problems and related data — the natural payload for a compressed emergency summary.', 'HL7 Australia / Sparked'],
    ips: ['International Patient Summary', 'A globally recognised minimal patient summary standard. G7 nations committed to adoption in 2021; the EU, USA, Canada and NZ have programmes underway. A conformant AU PS is also a conformant IPS.', 'HL7'],
    unverified: ['Unverified IHI', 'An IHI created at a healthcare facility where Services Australia has not been given evidence of identity. Unverified IHIs expire after a period of inactivity; provisional IHIs expire after 90 days.', 'HI Service provider guide'],
    audit: ['HI Service audit log', 'Every access to a healthcare identifier is recorded. Providers must give the HI Service enough information to identify the authorised user making each request. ADHA separately logs all emergency access use.', 'OAIC / Services Australia'],
    sbd: ['Sharing by default', 'Under the Health Legislation Amendment (Modernising My Health Record — Sharing by Default) Act 2025, pathology and diagnostic imaging reports must be uploaded to My Health Record by default from 1 July 2026. Medicines information from online prescribers was announced as next.', 'Dept of Health, Disability and Ageing'],
    restricted: ['Access controls', 'A consumer may set a Record Access Code or restrict individual documents. Outside the circumstances authorised by s.64, a provider may not even check whether restricted documents exist.', 'OAIC'],
    proda: ['PRODA and NASH', 'PRODA is the Commonwealth digital identity used to reach HPOS and the National Provider Portal. NASH certificates authenticate provider software to the HI Service and My Health Record. Both assume the device can reach the internet.', 'Services Australia'],
    crdt: ['CRDT', 'Conflict-free replicated data type. A data structure that multiple disconnected replicas can update independently and merge deterministically without coordination — the standard basis for offline-first clinical capture.', 'Distributed systems'],
    ttl: ['TTL', 'Time to live. An expiry window after which cached data is evicted or, in a cryptographic variant, becomes unreadable because its key has lapsed.', 'Caching'],
    goldengate: ['Offline replication', 'RFDS runs a replicated copy of its aeromedical EHR so field clinicians can enter and retrieve patient information on a tablet without an internet connection. Live since 2023.', 'Oracle / RFDS, 2023'],
    apps: ['Australian Privacy Principles', 'The thirteen principles in the Privacy Act 1988 governing collection, use, disclosure and security of personal information. APP 11 requires reasonable steps to protect information from misuse, loss and unauthorised access.', 'Privacy Act 1988 (Cth)'],
    dcpolicy: ['Security and access policy', 'Before registering to participate in My Health Record, an organisation must have a security and access policy in place. It should be reviewed at least annually and after significant legislative change.', 'ADHA'],
    catchment: ['Catchment', 'The resident population within an operational radius of a retrieval base. For a base like Charleville or Mount Isa this is tens of thousands of people — small enough that a compressed summary per resident is a modest storage footprint.', 'Author\'s estimate']
  };

  function gl(k, t) {
    const g = G[k];
    if (!g) return t;
    return '<span class="gl" tabindex="0">' + t + '<span class="tip"><b>' + g[0] + '</b>' + g[1] + '<cite>' + g[2] + '</cite></span></span>';
  }

  const TAGTXT = { go: 'buildable now', stop: 'policy-blocked', hold: 'conditional', dead: 'not reached' };

  const STRATS = [
    {
      id: 'pre', n: 'strategy one', t: 'Geographic pre-positioning', st: 'hold',
      s: 'Cache summaries for the resident catchment, refreshed on a cycle',
      body: 'Hold a compressed emergency summary for every resident within the operational radius of a base, refreshed nightly while the aircraft is on the ground and connected. You are not caching the record — you are caching the shape of it. For a base serving a ' + gl('catchment', 'catchment') + ' of tens of thousands, an ' + gl('aups', 'AU PS') + '-shaped summary of a few kilobytes each is a footprint measured in hundreds of megabytes, not terabytes.',
      pros: ['Zero latency at the point of need — the data is already on the aircraft.', 'Works with no connectivity at all during the mission.', 'Refresh happens at base, where bandwidth and authentication are not constrained.', 'Storage is trivial at catchment scale; this is not a capacity problem.'],
      cons: ['Misses exactly the population in the MVA scenario — grey nomads, FIFO workers, interstate freight.', 'Cache staleness is invisible to the clinician unless the summary carries its own currency marker.', 'Every refresh is a bulk IHI operation against the ' + gl('hiservice', 'HI Service') + ', each logged.', 'The clinical hit rate is unmeasured, and may be poor for trauma specifically.'],
      blockers: [
        ['Consent model mismatch', 'My Health Record access controls are evaluated at access time. Pre-positioning replicates data <em>before</em> any access event, which sits awkwardly with a design built around per-access checks. ' + gl('restricted', 'Restricted documents') + ' would need to be categorically ineligible for caching.'],

      verdict: ['hold', 'Technically straightforward, legally unsettled. The blocker is not storage or bandwidth — it is that pre-fetching health data for people who have not presented is not something the current consent and purpose-limitation model contemplates. Worth a formal position from ADHA before building.']
    },
    {
      id: 'jit', n: 'strategy two', t: 'Just-in-time fetch on tasking', st: 'stop',
      s: 'Partial identifier resolves base-side, summary pushed to the aircraft',
      body: 'The tasking event is the trigger. Whatever fragment exists — a name from a bystander, a registration plate, a Medicare card found in a wallet — goes back to base over whatever link holds. Base performs the resolution and pushes a compressed summary down while satcom is still available. Resolution stays in the connected environment where authentication, logging and governance are intact; the aircraft only ever receives an answer.',
      pros: ['Targets the actual patient rather than a probabilistic cohort.', 'Fuzzy matching and its audit burden stay base-side, under proper governance.', 'No bulk data at rest on the aircraft — only the summary for the current tasking.', 'Highest clinical value of the three, because it works for non-residents.'],

  const CONSID = [
    ['Payload design', 'go', '<p>The single most consequential decision, and the one that is now easiest. ' + gl('aups', 'AU Patient Summary') + ' reached R1 Working Standard in 2026, built on ' + gl('ips', 'IPS') + ' and AU Core. A minimal summary — allergies, medicines, problems, advance care directive flags — is a specified FHIR artefact rather than something each service invents.</p><p>At a few kilobytes it moves over a satcom link that would choke on a full document set. Design the payload first: it constrains every other decision, and it is the part with the least ambiguity.</p>'],
    ['Expiry as cryptography, not deletion', 'go', '<p>For a threat model that includes an aircraft lost or a tablet taken from an unattended vehicle, a cache eviction policy is the wrong mechanism — it has to run to work. Encrypt each cached summary under a key with a short lease. The key expires, the data becomes unreadable, no deletion is required.</p><p>This also gives a cleaner audit story than a ' + gl('ttl', 'TTL') + ' sweep: you can demonstrate the window in which data was capable of being read, rather than asserting that a job ran.</p>'],

    ['Write-back conflict handling', 'go', '<p>Multiple clinicians, multiple devices, intermittent sync. Mutable records with last-write-wins will silently destroy clinical documentation. Use append-only event logs — each observation an immutable event with timestamp and author — reconciled centrally, or a ' + gl('crdt', 'CRDT') + ' where merge semantics genuinely matter.</p><p>This is well-trodden distributed systems ground and needs no policy change.</p>'],

      '</div>' +
      '<div class="verdict is-' + v[0] + '" style="margin-top:24px"><div class="verdict-h">' + v[1] + '</div><div class="verdict-b">' + v[2] + '</div></div>' +
      '<div class="chain">' +
      HOPS.map(h => {
        const st = h.st[scen];
        const tt = { go: 'clears', stop: 'blocked', hold: 'conditional', dead: 'not reached' }[st];
        return '<div class="hop s-' + st + '"><div class="rail"><div class="dot"></div><div class="stem"></div></div>' +
          '<div class="card" tabindex="0" role="button" aria-expanded="false">' +
          '<div class="card-top"><span class="hop-n">' + h.n + '</span><span class="hop-t">' + h.t + '</span>' +
          '<span class="badge b-' + st + '">' + tt + '</span></div>' +
          '<div class="card-s">' + pick(h.s, scen) + '</div>' +
          '<div class="expand-hint">open for custodian, instrument and barrier</div>' +
          '<div class="detail">' +
          '<div class="drow"><span class="dk">Custodian</span><span class="dv">' + pick(h.holder, scen) + '</span></div>' +
          '<div class="drow"><span class="dk">Instrument</span><span class="dv">' + pick(h.instrument, scen) + '</span></div>' +
          '<div class="drow"><span class="dk">Barrier</span><span class="dv">' + pick(h.barrier, scen) + '</span></div>' +
          '</div></div></div>';
      }).join('') + '</div>' +
      label('the thing worth naming') +
      '<div class="body-text">Every element of this chain works. IHI lookup works. Break-glass works. Offline field capture works. What has no owner is the hop from a non-health fragment to a health identifier — and that hop crosses portfolios, so neither the ' + gl('hiact', 'HI Act') + ' nor state transport law was written with the other in view. NSW Ambulance has put a version of this on the parliamentary record: clinicians may not always be able to identify patients adequately enough to reach a record before treatment begins.</div>';
  }

  function paneConsiderations() {
    return label('applies regardless of approach') +
      '<div class="lede">Seven decisions that have to be made whichever strategy is chosen. Some are settled, some are open, and one should come before any of the others.</div>' +
      CONSID.map(c => '<div class="consid"><div class="consid-top"><span class="consid-h">' + c[0] + '</span>' +
        '<span class="badge b-' + c[1] + '">' + (c[1] === 'go' ? 'settled' : 'open') + '</span></div>' +
        '<div class="body-text">' + c[2] + '</div></div>').join('');
  }

  function paneSources() {
    return label('legislation, guidance and reporting') +
      '<div class="lede">Primary sources for the legal and technical claims made throughout. Current to July 2026.</div>' +
      '<table class="reftable"><thead><tr><th></th><th>Type</th><th>Source</th></tr></thead><tbody>' +
      REFS.map(r => '<tr><td class="num">' + r[0] + '</td><td>' + r[1] + '</td><td>' + r[2] + '</td></tr>').join('') +
      '</tbody></table>' +
      '<div class="pullquote">This is an architectural argument, not legal advice. The instruments are cited so they can be checked; the interpretation of how they interact in a retrieval context is the author\'s own. The hop that matters most — a non-health fragment to a health identifier — is precisely where no settled position appears to exist, and an absence of published policy is not the same as a policy of permission. Verify against current legislation and with the relevant custodians before relying on any of it.</div>';
  }

  function render() {
    const panes = { problem: paneProblem, strategies: paneStrategies, identity: paneIdentity, considerations: paneConsiderations, sources: paneSources };
    const app = document.getElementById('app');
    app.innerHTML = '<div class="wrap">' +
      '<div class="masthead">' +
      '<div class="eyebrow"><span class="eyebrow-rule"></span><span class="eyebrow-txt">distributed data architecture / aeromedical retrieval</span></div>' +
      '<h1>Caching a record for a patient you haven\'t met</h1>' +
      '<p class="standfirst">Edge data replication assumes you know whose data to place at the edge. Aeromedical retrieval does not offer that. An exploration of three architectural responses, what each costs, and where each one stops.</p>' +
      '<p class="byline">grounded in Australian legislation current to July 2026 · hover underlined terms for definitions</p></div>' +
      '<div class="nav" role="tablist">' +
      TABS.map(t => '<button role="tab" data-tab="' + t[0] + '" aria-selected="' + (t[0] === tab) + '">' + t[1] + '</button>').join('') +
      '</div><div class="pane">' + panes[tab]() + '</div></div>';

    app.querySelectorAll('.nav button').forEach(b => b.addEventListener('click', () => { tab = b.dataset.tab; render(); }));
    app.querySelectorAll('.strat').forEach(b => b.addEventListener('click', () => { strat = b.dataset.strat; render(); }));
    app.querySelectorAll('.scn').forEach(b => b.addEventListener('click', () => { scen = b.dataset.scn; render(); }));
    app.querySelectorAll('.card').forEach(c => {
      const toggle = () => {
        const open = c.classList.toggle('open');
        c.setAttribute('aria-expanded', open);
        c.querySelector('.expand-hint').textContent = open ? 'close' : 'open for custodian, instrument and barrier';
      };
      c.addEventListener('click', e => { if (!e.target.closest('.gl') && !e.target.closest('a')) toggle(); });
      c.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && !e.target.closest('a')) { e.preventDefault(); toggle(); } });
    });
  }

  render();
})();
</script>
