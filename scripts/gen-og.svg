<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <style>
      @font-face {
        font-family: 'Georgia';
        src: local('Georgia');
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#fbfaf7"/>

  <!-- Top rule -->
  <rect x="60" y="60" width="1080" height="3" fill="#1a1814"/>

  <!-- Thin rule below masthead -->
  <rect x="60" y="190" width="1080" height="1" fill="#8b2e23"/>

  <!-- Bottom rule -->
  <rect x="60" y="567" width="1080" height="3" fill="#1a1814"/>

  <!-- Masthead: intercate.net -->
  <text
    x="600"
    y="158"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="96"
    font-weight="400"
    fill="#1a1814"
    text-anchor="middle"
    letter-spacing="-1"
  >intercate.net</text>

  <!-- Brick-red horizontal accent line (second) -->
  <rect x="60" y="196" width="1080" height="1" fill="#1a1814"/>

  <!-- Author name -->
  <text
    x="600"
    y="360"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="56"
    font-weight="400"
    fill="#1a1814"
    text-anchor="middle"
  >Andrew Morrison</text>

  <!-- Descriptor -->
  <text
    x="600"
    y="440"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="30"
    font-weight="400"
    fill="#8b2e23"
    text-anchor="middle"
    font-style="italic"
  >Writing on AI, policy, and technology</text>

  <!-- Bottom thin rule -->
  <rect x="60" y="560" width="1080" height="1" fill="#8b2e23"/>
</svg>
